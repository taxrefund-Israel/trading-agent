name: Daily TA-125 Signals

# מריץ את מנוע ה-Paper Trading פעם ביום אחרי סגירת הבורסה ושולח איתותים לטלגרם.
# רץ בענן של GitHub — ללא תלות במחשב שלך.

on:
  schedule:
    # 15:30 UTC = 18:30 שעון ישראל (קיץ). ימי א'-ה' בלבד (0=ראשון .. 4=חמישי).
    # cron של GitHub ב-UTC; ייתכן עיכוב של מספר דקות בזמני עומס — ה-catchup משלים פערים.
    - cron: "30 15 * * 0-4"
  workflow_dispatch:   # מאפשר הרצה ידנית מלשונית Actions

permissions:
  contents: write       # נדרש כדי לשמור (commit) את מצב התיק חזרה לריפו

concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem          # כדי ש-datetime.now() יהיה שעון ישראל
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bot.txt

      - name: Run daily engine + send Telegram signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_trader.py

      - name: Commit updated portfolio state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_trades.db logs/ || true
          if git diff --staged --quiet; then
            echo "אין שינוי במצב התיק (לא יום מסחר / כבר רץ)."
          else
            git commit -m "Daily run: update portfolio state [skip ci]"
            git push
          fi

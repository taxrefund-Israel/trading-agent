name: Weekly US Momentum Signals

# מריץ את סוכן המומנטום האמריקאי פעם בשבוע ושולח איתות לטלגרם.
# רץ בענן של GitHub — ללא תלות במחשב הביתי.
# יום ב' 12:07 UTC = ‏14:07/15:07 שעון ישראל — על נתוני סגירת שישי, לפני פתיחת וול-סטריט.

on:
  schedule:
    - cron: "7 12 * * 1"
  workflow_dispatch:   # הרצה ידנית מלשונית Actions

permissions:
  contents: write       # שמירת מצב התיק חזרה לריפו

concurrency:
  group: us-weekly-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bot.txt

      - name: Run weekly US momentum agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL:       ${{ vars.DASHBOARD_URL }}
          US_DASHBOARD_URL:    ${{ vars.US_DASHBOARD_URL }}
        run: python us_agent.py

      - name: Commit updated portfolio state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us_portfolio_state.json logs_us/ || true
          if git diff --staged --quiet; then
            echo "אין שינוי במצב התיק."
          else
            git commit -m "Weekly US run: update portfolio state [skip ci]"
            git push
          fi
